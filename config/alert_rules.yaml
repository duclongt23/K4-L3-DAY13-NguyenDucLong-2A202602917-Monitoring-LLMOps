alerts:
  - name: high_latency_p95
    severity: critical
    condition: "percentile(latency_ms, 95) > 3000"
    duration: 5m
    type: symptom-based
    channel: slack
    owner: team-llmops
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate
    severity: warning
    condition: "error_rate_pct > 2"
    duration: 3m
    type: symptom-based
    channel: slack
    owner: team-llmops
    runbook: docs/alerts.md#alert-2
  - name: cost_spike
    severity: warning
    condition: "total_cost_usd > 2.5"
    duration: 1m
    type: symptom-based
    channel: slack
    owner: team-llmops
    runbook: docs/alerts.md#alert-3
